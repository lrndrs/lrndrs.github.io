research_code:
  - name: Dye tracer Analysis Code and Figure Scripts
    repo: dyetracer_palaeo_figurescripts
    description: >-
      Scripts and data for "Tracing Meltwater from Northern Ice Sheets to
      Palaeoclimate Archives During the Early Last Deglaciation: a conservative
      tracer approach."
    language: Jupyter Notebook
  - name: Fluorescence Analysis Scripts
    repo: Fluorescence_LaVallina_QR
    description: >-
      R code to reproduce plots for "Climatic and cave settings influence on
      drip water fluorescent organic matter with implications for fluorescent
      laminations in stalagmites" (Quaternary Research, 2023).
    language: R / HTML
 
  - name: Palaeo Transition Midpoints
    repo: midpoints_EnsembleComputation
    description: >-
      Computes palaeo transition midpoints with an errors-in-variables
      approach; overall uncertainty via MCMC ensemble draws. 
    language: R

teaching_resources:
  - name: SISAL Workshop
    repo: workshop_dev
    description: Development repository for the SISAL database training workshop.
    language: Workshop
  - name: Climate History & Model Practical (WS2024)
    repo: climate-history-model-practical-WS2024
    description: Practical session materials on climate history and modelling.
    language: Jupyter Notebook
