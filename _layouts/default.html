<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.url contains 'publications' %}class="active"{% endif %}>Publications</a>
        <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains 'teaching' %}class="active"{% endif %}>Teaching &amp; Supervision</a>
        <a href="{{ '/repositories/' | relative_url }}" {% if page.url contains 'repositories' %}class="active"{% endif %}>Repositories</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        {{ site.author }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
        <a href="https://orcid.org/{{ site.orcid_id }}">ORCID</a> ·
        <a href="https://github.com/{{ site.github_user }}">GitHub</a>
      </p>
    </div>
  </footer>
</body>
</html>
